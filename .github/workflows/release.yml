name: Release

# Tag-triggered PyPI release with PEP 740 attestations via OIDC trusted publishing.
# No token: the publish step uses the GitHub OIDC identity, which PyPI maps to a
# Trusted Publisher configured for this repo + workflow. Attestations are produced
# automatically by pypa/gh-action-pypi-publish (>= v1.11.0) under a trusted publisher.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # OIDC: PyPI trusted publishing + PEP 740 + SBOM attestation signing
  contents: read
  attestations: write # store the signed CycloneDX SBOM attestation

# Serialize releases on the same tag so two close pushes can't race into a
# double-publish (the second would red-fail on "file already exists").
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          # No dependency cache in the release build: a poisoned cache could
          # tamper with the published artifact (zizmor cache-poisoning).

      - name: Install (with dev + verify extras)
        run: pip install -e '.[dev]'

      # Full gate — identical to CI; a tagged release must not ship anything CI
      # would have rejected.
      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (pyright strict)
        run: pyright

      - name: Type completeness (pyright --verifytypes, must be 100%)
        run: pyright --verifytypes agledger --ignoreexternal

      - name: Test
        run: pytest

      # Guard: the pushed tag (vX.Y.Z) must match the version in pyproject.toml,
      # so a stale tag can never publish a mismatched artifact to PyPI.
      - name: Verify tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "Tag version:       $TAG_VERSION"
          echo "pyproject version: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          pip install build==1.5.0
          python -m build

      # SBOM scoped to the SHIPPED wheel's runtime deps — install the built wheel
      # (no dev/test extras) into a throwaway venv and enumerate that, NOT the
      # release runner's venv (which carries build/ruff/pyright/pytest).
      - name: Generate CycloneDX SBOM (scoped to the shipped wheel)
        run: |
          pip install cyclonedx-bom==7.3.0
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --quiet dist/*.whl
          cyclonedx-py environment /tmp/sbomenv/bin/python -o sbom.cdx.json

      - name: Attest CycloneDX SBOM (signed, verifiable)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1 (attest-sbom is deprecated)
        with:
          subject-path: 'dist/*'
          predicate-type: 'https://cyclonedx.org/bom'
          predicate-path: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      # Publishes dist/* to PyPI via OIDC trusted publishing. PEP 740 attestations
      # are ON by default under a trusted publisher (attestations: true is implicit).
      # No API token — the Trusted Publisher mapping on PyPI authorizes this exact
      # repo + workflow. Pinned to v1.13.0 (commit SHA).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
