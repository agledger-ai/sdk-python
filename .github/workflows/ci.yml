name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Legal files match their pins, and no retired name appears
        run: |
          grep -v '^#' legal-pins.sha256 | sha256sum --strict -c -
          if git grep -nE 'Agentic Ledger|AOAP|Agentic Operations and Accountability|Agent Health Score|Agentic Contract Spec|®' -- ':!CHANGELOG.md' ':!.github/workflows/ci.yml' ':!testdata/conformance'; then
            echo "A retired product name or a registered-mark symbol appears outside CHANGELOG.md" >&2
            exit 1
          fi

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install (with dev + verify extras)
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (pyright strict)
        run: pyright

      - name: Type completeness (pyright --verifytypes, must be 100%)
        run: pyright --verifytypes agledger --ignoreexternal

      - name: Test
        run: pytest
