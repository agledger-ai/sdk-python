version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    # A library's >= floors are the oldest versions it is tested against
    # (the CI floors job), not the newest release: only move a requirement
    # when a release falls outside it. Security updates still raise floors.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
