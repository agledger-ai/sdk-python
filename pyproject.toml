[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agledger"
version = "1.10.0"
description = "AGLedger Python SDK: change control for AI agents, self-hosted and signed."
readme = "README.md"
license = "LicenseRef-Proprietary"
# Floor tracks Python's EOL schedule, taken as the old version comes due rather
# than on its exact expiry date: the edit is one line either way, so there is no
# reason to run it to the wire. 3.10 was dropped 2026-08-03 ahead of its
# 2026-10-31 end-of-life. Next: 3.11 goes EOL 2027-10-31.
#
# Before raising this, know that pip enforces it at resolve time, unlike npm's
# advisory engines field. It does not error on an older interpreter; it quietly
# backsolves to the last release that allowed it, so a floor raise silently
# freezes those users on a stale version unless the CHANGELOG says so.
requires-python = ">=3.11"
authors = [{ name = "AGLedger LLC", email = "support@agledger.ai" }]
keywords = ["agledger", "records", "accountability", "agents", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1",
    "pydantic>=2.0.0,<3",
]

[project.urls]
Homepage = "https://www.agledger.ai"
Repository = "https://github.com/agledger-ai/sdk-python"
Changelog = "https://github.com/agledger-ai/sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
verify = [
    "cryptography>=42.0",
    "cbor2>=5.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "cryptography>=42.0",
    "cbor2>=5.6",
    # Pinned so CI matches the gate the SDK was validated against. Ruff stable
    # adds lint rules and pyright tightens inference across releases; an
    # unpinned floor would let a tool bump turn CI red without a code change.
    "ruff==0.16.4",
    "pyright==1.1.411",
]

[project.scripts]
# Turnkey offline verifier CLI. Auto-detects a dump directory vs an
# /audit-export JSON file. Needs the [verify] extra (cbor2 + cryptography).
agledger-verify = "agledger.verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agledger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run against the working tree in src/, never a stale installed wheel. Without
# this, pytest imports site-packages `agledger` and silently validates the last
# published version instead of local changes (this masked F-713/F-710/F-706).
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The rule set is written out rather than inherited, because ruff's default is
# not stable across releases: 0.16 widened it from 58 rules to several hundred,
# so `ruff==0.15.21` and `ruff==0.16.4` disagreed about what "lint" means on
# identical source with identical config. A dependency bump inside a caret range
# should not be able to redefine the gate. Everything below was measured against
# this codebase before being turned on.
select = [
    "E4", "E7", "E9", "F",  # the historical baseline
    "I",                     # import sorting
    "UP",                    # pyupgrade; target-version is py311
    "RUF",                   # ruff-specific, incl. unsorted __all__
    "PIE",                   # unnecessary pass / duplicate class fields
    "ISC",                   # implicit string concat; catches a missing comma
    "PERF",                  # comprehension and loop rewrites
    "FURB",                  # modernizations
    "PYI034",                # __enter__ / __aenter__ should return Self
    "PLR0402",               # `import x.y as y` -> `from x import y`
]

# E701: the codebase uses the `if cond: stmt` one-liner deliberately throughout
# (it is the `if x is not None: body[...] = x` body-builder pattern), 235 times.
ignore = ["E701"]

# Deliberately NOT selected, each because it fights a decision this SDK has
# already made. Recorded here so the next person weighing them does not have to
# re-derive the answer:
#
#   BLE001  15 hits, every one a fail-closed boundary over untrusted input
#           (CBOR/base64/signature parsing, the FIPS capability probe, an error
#           body from the Server). Catching broadly and degrading to "invalid"
#           is the security property; narrowing it would let an unanticipated
#           exception escape as something other than a verification failure.
#   PYI051  53 hits, all `Literal[...] | str`. That union is deliberate: it
#           names the values the API serves today while still parsing one added
#           by a newer Server, instead of raising.
#   TRY003  27 hits. Error messages here are long on purpose; every response and
#           exception is meant to carry the next action.
#   PLR0913 40 hits. Resource methods take the API's filters as keyword
#           parameters by design; that is the DX, not an accident.
#   D       800 hits. A docstring-style decision, not a lint one, and not one to
#           make inside a dependency bump.

[tool.ruff.lint.isort]
# Keep aliased imports from one module in one statement. Without this, isort
# splits `from x import (A as _A, B as _B)` into a separate statement per name,
# which is legal and reads badly, and did exactly that to the `cryptography`
# imports in the verifier.
combine-as-imports = true

[tool.pyright]
# Strict-gate the shipped library only. Tests are exercised by pytest, not the
# type gate: strict mode on test fixtures (respx mocks, ad-hoc dicts) is noise,
# not signal. `pyright` with no args (as CI runs it) now checks exactly `src`.
include = ["src"]
# Resolve `import agledger` to the source tree (src layout) regardless of whether
# an editable/wheel copy is also installed, which keeps `pyright --verifytypes agledger`
# (the type-completeness gate) measuring exactly what ships, not a stale install.
extraPaths = ["src"]
typeCheckingMode = "strict"
